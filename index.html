<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap');

#pr-root, #pr-root * { box-sizing: border-box; }

#pr-root {
  --bg: #FBF3FA;
  --bg2: #F3EEFF;
  --surface: #FFFFFF;
  --line: #F0E3F3;
  --text: #4A3B55;
  --text-dim: #9C8CA8;
  --pink: #FF9FC2;
  --pink-deep: #FF6FA0;
  --lav: #B9A2F5;
  --mint: #7FE0C0;
  --peach: #FFC48C;
  --yellow: #FFD873;

  font-family: 'Nunito', sans-serif;
  background: linear-gradient(160deg, var(--bg), var(--bg2));
  color: var(--text);
  min-height: 100%;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}

#pr-root .pr-scroll {
  max-width: 460px;
  margin: 0 auto;
  padding: 26px 18px 40px;
  min-height: 560px;
}

#pr-root h1, #pr-root h2, #pr-root h3 {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  margin: 0;
}

#pr-root .pr-brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
#pr-root .pr-brand h1 { font-size: 30px; color: var(--pink-deep); display: flex; align-items: center; gap: 8px; }
#pr-root .pr-tag { color: var(--text-dim); font-size: 14px; margin-bottom: 22px; font-weight: 600; }

#pr-root .pr-switch {
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-dim);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  padding: 7px 12px;
  border-radius: 999px;
}
#pr-root .pr-switch:hover { color: var(--pink-deep); border-color: var(--pink); }

/* ---- Cards ---- */
#pr-root .pr-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 6px 18px rgba(180, 130, 200, 0.10);
}

/* ---- Login ---- */
#pr-root .pr-login-card p { color: var(--text-dim); font-size: 14px; margin: 0 0 18px; line-height: 1.5; font-weight: 600; }

#pr-root label { display: block; font-size: 12px; color: var(--text-dim); font-weight: 700; margin-bottom: 6px; }

#pr-root input[type=text] {
  width: 100%;
  background: var(--bg);
  border: 2px solid var(--line);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 16px;
  outline: none;
  transition: border-color .15s;
}
#pr-root input[type=text]:focus { border-color: var(--pink); }

#pr-root .pr-avatar-picker-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
#pr-root .pr-avatar-preview {
  width: 60px; height: 60px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
  background: var(--bg2); border: 2px solid var(--line);
  overflow: hidden;
}
#pr-root .pr-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

#pr-root .pr-upload-btn {
  background: var(--bg2);
  border: 2px dashed var(--lav);
  color: var(--lav);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 12px;
  padding: 9px 14px;
  border-radius: 999px;
  cursor: pointer;
}
#pr-root .pr-upload-btn:hover { background: #EFE9FF; }

#pr-root .pr-emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
#pr-root .pr-emoji-opt {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--bg);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
#pr-root .pr-emoji-opt.selected { border-color: var(--pink-deep); background: #FFE9F1; }

#pr-root .pr-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  color: #fff;
  border: none;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 16px;
  padding: 13px 16px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .08s ease, filter .15s;
}
#pr-root .pr-btn:hover { filter: brightness(1.05); }
#pr-root .pr-btn:active { transform: scale(0.97); }

#pr-root .pr-existing { margin-top: 20px; }
#pr-root .pr-existing-label { font-size: 12px; color: var(--text-dim); font-weight: 700; margin-bottom: 10px; }
#pr-root .pr-chips { display: flex; flex-wrap: wrap; gap: 8px; }
#pr-root .pr-chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--bg2);
  border: 2px solid var(--line);
  color: var(--text);
  font-weight: 700;
  font-size: 13px;
  padding: 6px 13px 6px 6px;
  border-radius: 999px;
  cursor: pointer;
}
#pr-root .pr-chip:hover { border-color: var(--pink); }
#pr-root .pr-chip-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; background: var(--surface); overflow: hidden; flex-shrink: 0;
}
#pr-root .pr-chip-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ---- Dashboard ---- */
#pr-root .pr-rankcard {
  background: linear-gradient(150deg, #FFFFFF, var(--bg2));
  margin-bottom: 16px;
  position: relative;
}
#pr-root .pr-rankcard.is-shitmaster { box-shadow: 0 0 0 2px var(--yellow), 0 8px 22px rgba(255, 200, 90, 0.35); }

#pr-root .pr-rank-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
#pr-root .pr-rank-avatar {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; background: var(--surface); border: 2px solid var(--line);
  overflow: hidden; flex-shrink: 0;
}
#pr-root .pr-rank-avatar img { width: 100%; height: 100%; object-fit: cover; }
#pr-root .pr-rank-name { font-family: 'Fredoka'; font-size: 20px; }
#pr-root .pr-tier-badge {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 12px;
  padding: 4px 11px;
  border-radius: 999px;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

#pr-root .pr-count-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
#pr-root .pr-count-num { font-family: 'Fredoka', sans-serif; font-size: 32px; color: var(--pink-deep); }
#pr-root .pr-count-label { color: var(--text-dim); font-size: 13px; font-weight: 700; }

#pr-root .pr-progress-track {
  background: var(--bg2);
  border-radius: 999px;
  height: 10px;
  overflow: hidden;
  margin-bottom: 8px;
}
#pr-root .pr-progress-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
#pr-root .pr-progress-note { font-size: 12px; color: var(--text-dim); font-weight: 700; }

#pr-root .pr-log-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--peach), var(--pink-deep));
  color: #fff;
  border: none;
  font-family: 'Fredoka', sans-serif;
  font-size: 22px;
  font-weight: 600;
  padding: 18px;
  border-radius: 18px;
  cursor: pointer;
  margin-bottom: 8px;
  box-shadow: 0 8px 18px rgba(255, 130, 160, 0.35);
  transition: transform .08s ease, filter .15s;
}
#pr-root .pr-log-btn:hover { filter: brightness(1.04); }
#pr-root .pr-log-btn:active { transform: scale(0.97); }
#pr-root .pr-log-sub { text-align: center; color: var(--text-dim); font-size: 12px; font-weight: 700; margin-bottom: 24px; }

#pr-root .pr-section-title { font-family: 'Fredoka'; font-size: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

#pr-root .pr-tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--bg2); border-radius: 12px; padding: 4px; }
#pr-root .pr-tab {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: 'Nunito';
  font-weight: 800;
  font-size: 13px;
  padding: 9px;
  border-radius: 9px;
  cursor: pointer;
}
#pr-root .pr-tab.active { background: var(--surface); color: var(--pink-deep); }

#pr-root .pr-percentile {
  background: #FFF3E4;
  border: 2px solid #FFE1BA;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 13px;
  color: #A9773A;
  font-weight: 700;
  margin-bottom: 16px;
}
#pr-root .pr-percentile b { color: #8A5A1E; }

#pr-root .pr-board { list-style: none; margin: 0 0 24px; padding: 0; }
#pr-root .pr-board-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  margin-bottom: 6px;
  background: var(--surface);
  border: 2px solid var(--line);
}
#pr-root .pr-board-row.is-me { border-color: var(--pink); background: #FFF3F8; }
#pr-root .pr-board-pos { font-family: 'Fredoka'; font-size: 15px; color: var(--text-dim); width: 20px; }
#pr-root .pr-board-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; background: var(--bg2); overflow: hidden; flex-shrink: 0;
}
#pr-root .pr-board-avatar img { width: 100%; height: 100%; object-fit: cover; }
#pr-root .pr-board-name { flex: 1; font-size: 14px; font-weight: 700; }
#pr-root .pr-board-count { font-family: 'Fredoka', sans-serif; font-size: 16px; color: var(--pink-deep); }

/* ---- Chart ---- */
#pr-root .pr-chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
#pr-root .pr-chart-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; background: var(--bg2); overflow: hidden; flex-shrink: 0;
  border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--line);
}
#pr-root .pr-chart-avatar img { width: 100%; height: 100%; object-fit: cover; }
#pr-root .pr-chart-mid { flex: 1; }
#pr-root .pr-chart-name-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
#pr-root .pr-chart-count { color: var(--pink-deep); }
#pr-root .pr-chart-track { background: var(--bg2); border-radius: 999px; height: 14px; overflow: hidden; }
#pr-root .pr-chart-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }

#pr-root .pr-empty { color: var(--text-dim); font-size: 13px; padding: 20px 4px; text-align: center; font-weight: 700; }

#pr-root .pr-feed-item {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line);
}
#pr-root .pr-feed-item:last-child { border-bottom: none; }
#pr-root .pr-feed-item span:first-child { color: var(--text); font-weight: 700; }

#pr-root .pr-toast {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: var(--pink-deep);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 999px;
  box-shadow: 0 8px 20px rgba(255, 100, 150, 0.4);
  animation: pr-toast-in .25s ease;
  white-space: nowrap;
  z-index: 5;
}
@keyframes pr-toast-in { from { opacity:0; transform: translateX(-50%) translateY(8px);} to {opacity:1; transform: translateX(-50%) translateY(0);} }

#pr-root .pr-loading { padding: 80px 20px; text-align: center; color: var(--text-dim); font-weight: 700; font-size: 14px; }
</style>

<div id="pr-root"><div class="pr-scroll" id="pr-app"><div class="pr-loading">Warming up the throne… 🚽</div></div></div>

<script>
(function(){
  const root = document.getElementById('pr-app');

  const TIERS = [
    { name: 'Bronze', min: 0, color: '#D6A66B', emoji: '🥉' },
    { name: 'Silver', min: 5, color: '#AEB6C2', emoji: '🥈' },
    { name: 'Gold', min: 15, color: '#F0B84B', emoji: '🥇' },
    { name: 'Shitmaster', min: 30, color: '#FF9FC2', emoji: '👑' },
  ];

  const EMOJI_OPTIONS = ['💩','🧻','🚽','🪠','😎','🐸','🦄','🐵','🦊','🐼','👻','🍑','🌈','⭐'];

  let state = {
    screen: 'loading', // loading | login | dashboard
    currentUser: null, // {slug, name, avatar, photo}
    users: {},         // slug -> {slug, name, avatar, photo, createdAt}
    poops: [],         // {id, user, ts}
    tab: 'today',       // today | alltime
    loginName: '',
    loginEmoji: '💩',
    loginPhoto: null,
    toast: null,
    busy: false,
  };
  let toastTimer = null;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slugify(name){
    const s = String(name).trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'').slice(0,30);
    return s || ('user' + Date.now());
  }
  function getTier(count){
    let t = TIERS[0];
    for (const tier of TIERS) if (count >= tier.min) t = tier;
    return t;
  }
  function nextTier(count){
    const idx = TIERS.findIndex(t => t.name === getTier(count).name);
    return TIERS[idx+1] || null;
  }
  function isToday(ts){
    const a = new Date(ts), b = new Date();
    return a.toDateString() === b.toDateString();
  }
  function fmtTime(ts){
    return new Date(ts).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  }
  function timeAgo(ts){
    const diff = Date.now() - ts;
    const m = Math.floor(diff/60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if (h < 24) return h + 'h ago';
    return new Date(ts).toLocaleDateString([], {month:'short', day:'numeric'});
  }
  function showToast(msg){
    state.toast = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toast = null; render(); }, 2200);
  }
  function avatarHtml(user, size){
    if (user && user.photo) return `<img src="${user.photo}" alt="" />`;
    return escapeHtml((user && user.avatar) || '💩');
  }

  async function loadAll(){
    try {
      const [userList, poopList] = await Promise.all([
        window.storage.list('user:', true),
        window.storage.list('poop:', true),
      ]);
      const users = {};
      if (userList && userList.keys) {
        const vals = await Promise.all(userList.keys.map(k => window.storage.get(k, true).catch(() => null)));
        vals.forEach(v => { if (v) { try { const u = JSON.parse(v.value); users[u.slug] = u; } catch(e){} } });
      }
      const poops = [];
      if (poopList && poopList.keys) {
        const vals = await Promise.all(poopList.keys.map(k => window.storage.get(k, true).catch(() => null)));
        vals.forEach(v => { if (v) { try { poops.push(JSON.parse(v.value)); } catch(e){} } });
      }
      state.users = users;
      state.poops = poops.sort((a,b) => b.ts - a.ts);
    } catch(e) {
      console.error('loadAll failed', e);
    }
  }

  async function trySession(){
    try {
      const res = await window.storage.get('session', false);
      if (res && res.value) {
        const { slug } = JSON.parse(res.value);
        if (slug && state.users[slug]) {
          state.currentUser = state.users[slug];
          state.screen = 'dashboard';
          return;
        }
      }
    } catch(e) { /* no session yet */ }
    state.screen = 'login';
  }

  async function init(){
    await loadAll();
    await trySession();
    render();
  }

  async function handleCreateOrLogin(name, avatar, photo){
    const trimmed = name.trim();
    if (!trimmed) return;
    const slug = slugify(trimmed);
    let user = state.users[slug];
    if (!user) {
      user = { slug, name: trimmed.slice(0, 24), avatar: avatar || '💩', photo: photo || null, createdAt: Date.now() };
      try {
        await window.storage.set('user:' + slug, JSON.stringify(user), true);
        state.users[slug] = user;
      } catch(e) {
        showToast("Couldn't create profile, try again");
        return;
      }
    }
    state.currentUser = user;
    state.screen = 'dashboard';
    try { await window.storage.set('session', JSON.stringify({ slug }), false); } catch(e){}
    render();
  }

  async function handleLogPoop(){
    if (!state.currentUser || state.busy) return;
    state.busy = true;
    const ts = Date.now();
    const id = 'poop:' + ts + '_' + Math.random().toString(36).slice(2,7);
    const entry = { user: state.currentUser.slug, ts };
    try {
      await window.storage.set(id, JSON.stringify(entry), true);
      state.poops.unshift(entry);
      showToast('💩 Logged at ' + fmtTime(ts) + '!');
    } catch(e) {
      showToast("Couldn't log that, try again");
    }
    state.busy = false;
    render();
  }

  function handleSwitchUser(){
    state.currentUser = null;
    state.screen = 'login';
    state.loginName = '';
    state.loginEmoji = '💩';
    state.loginPhoto = null;
    window.storage.delete('session', false).catch(()=>{});
    render();
  }

  function handlePhotoFile(file){
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        state.loginPhoto = canvas.toDataURL('image/jpeg', 0.75);
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function aggregate(filterFn){
    const counts = {};
    state.poops.filter(filterFn).forEach(p => { counts[p.user] = (counts[p.user]||0) + 1; });
    return counts;
  }

  function buildBoard(tab){
    const counts = tab === 'today' ? aggregate(p => isToday(p.ts)) : aggregate(() => true);
    const rows = Object.keys(state.users).map(slug => ({
      slug, user: state.users[slug], count: counts[slug] || 0
    }));
    rows.sort((a,b) => b.count - a.count);
    return rows;
  }

  function renderLogin(){
    const existing = Object.values(state.users).sort((a,b) => a.name.localeCompare(b.name));
    return `
      <div class="pr-brand"><h1>PoopRanked 💩</h1></div>
      <div class="pr-tag">Competitive pooping. Bronze → Silver → Gold → Shitmaster 👑</div>
      <div class="pr-card pr-login-card">
        <p>Enter your name to join the board. No password — just don't log for your friends.</p>
        <label for="pr-name-input">Your name</label>
        <input id="pr-name-input" type="text" placeholder="e.g. Dave" value="${escapeHtml(state.loginName)}" maxlength="24" />

        <label>Profile pic</label>
        <div class="pr-avatar-picker-row">
          <div class="pr-avatar-preview">${avatarHtml({avatar: state.loginEmoji, photo: state.loginPhoto})}</div>
          <button class="pr-upload-btn" data-action="upload-trigger">Upload a photo</button>
          <input type="file" id="pr-photo-input" accept="image/*" style="display:none" />
        </div>
        <div class="pr-emoji-grid">
          ${EMOJI_OPTIONS.map(em => `<button class="pr-emoji-opt ${!state.loginPhoto && state.loginEmoji === em ? 'selected' : ''}" data-action="pick-emoji" data-emoji="${em}">${em}</button>`).join('')}
        </div>

        <button class="pr-btn" data-action="login">Join the board 🏆</button>
        ${existing.length ? `
          <div class="pr-existing">
            <div class="pr-existing-label">Or pick yourself out</div>
            <div class="pr-chips">
              ${existing.map(u => `<button class="pr-chip" data-action="quick-login" data-slug="${escapeHtml(u.slug)}"><span class="pr-chip-avatar">${avatarHtml(u)}</span>${escapeHtml(u.name)}</button>`).join('')}
            </div>
          </div>` : ''}
      </div>
    `;
  }

  function renderDashboard(){
    const me = state.currentUser;
    const myAllTime = state.poops.filter(p => p.user === me.slug).length;
    const myToday = state.poops.filter(p => p.user === me.slug && isToday(p.ts)).length;
    const tier = getTier(myAllTime);
    const next = nextTier(myAllTime);
    const pct = next ? Math.min(100, Math.round(((myAllTime - tier.min) / (next.min - tier.min)) * 100)) : 100;

    const todayBoard = buildBoard('today').filter(r => r.count > 0);
    const myTodayIdx = todayBoard.findIndex(r => r.slug === me.slug);

    let percentileHtml = '';
    if (myTodayIdx >= 0 && todayBoard.length > 0) {
      const place = Math.max(1, Math.round(((myTodayIdx + 1) / todayBoard.length) * 100));
      percentileHtml = `<div class="pr-percentile">🏆 You're in the <b>top ${place}%</b> of dumpers today!</div>`;
    } else {
      percentileHtml = `<div class="pr-percentile">Log one today to enter the daily rankings 💩</div>`;
    }

    const myFeed = state.poops.filter(p => p.user === me.slug).slice(0, 5);

    let boardHtml = '';
    if (state.tab === 'today') {
      const board = todayBoard;
      boardHtml = board.length === 0 ? `<div class="pr-empty">No dumps yet today. Be the first! 💩</div>` :
        `<ul class="pr-board">${board.map((r, i) => `
          <li class="pr-board-row ${r.slug === me.slug ? 'is-me' : ''}">
            <span class="pr-board-pos">${i === 0 ? '🏆' : i+1}</span>
            <span class="pr-board-avatar">${avatarHtml(r.user)}</span>
            <span class="pr-board-name">${escapeHtml(r.user.name)}</span>
            <span class="pr-board-count">${r.count}</span>
          </li>
        `).join('')}</ul>`;
    } else {
      const board = buildBoard('alltime');
      const max = Math.max(1, board[0] ? board[0].count : 1);
      const barColors = [tier => tier]; // unused placeholder
      boardHtml = board.every(r => r.count === 0) ? `<div class="pr-empty">No dumps logged yet. Get going! 💩</div>` :
        board.map((r, i) => {
          const t = getTier(r.count);
          const width = Math.max(6, Math.round((r.count / max) * 100));
          return `
            <div class="pr-chart-row">
              <div class="pr-chart-avatar">${avatarHtml(r.user)}</div>
              <div class="pr-chart-mid">
                <div class="pr-chart-name-row">
                  <span>${i === 0 && r.count > 0 ? '🏆 ' : ''}${escapeHtml(r.user.name)}</span>
                  <span class="pr-chart-count">${r.count}</span>
                </div>
                <div class="pr-chart-track"><div class="pr-chart-fill" style="width:${width}%; background:${t.color}"></div></div>
              </div>
            </div>
          `;
        }).join('');
    }

    return `
      <div class="pr-brand">
        <h1>PoopRanked 💩</h1>
        <button class="pr-switch" data-action="switch">switch</button>
      </div>
      <div class="pr-tag">Hey ${escapeHtml(me.name)}! Keep the streak alive 🔥</div>

      <div class="pr-card pr-rankcard ${tier.name === 'Shitmaster' ? 'is-shitmaster' : ''}">
        <div class="pr-rank-top">
          <div class="pr-rank-avatar">${avatarHtml(me)}</div>
          <div>
            <div class="pr-rank-name">${escapeHtml(me.name)}</div>
            <div class="pr-tier-badge" style="background:${tier.color}">${tier.emoji} ${tier.name}</div>
          </div>
        </div>
        <div class="pr-count-row">
          <div class="pr-count-num">${myAllTime}</div>
          <div class="pr-count-label">lifetime · ${myToday} today</div>
        </div>
        <div class="pr-progress-track">
          <div class="pr-progress-fill" style="width:${pct}%; background:${tier.color}"></div>
        </div>
        <div class="pr-progress-note">${next ? (next.min - myAllTime) + ' more to reach ' + next.emoji + ' ' + next.name : '👑 Peak rank reached. Respect.'}</div>
      </div>

      <button class="pr-log-btn" data-action="log" ${state.busy ? 'disabled' : ''}>💩 i pooped</button>
      <div class="pr-log-sub">Stamps the current time automatically</div>

      ${percentileHtml}

      <div class="pr-tabs">
        <button class="pr-tab ${state.tab === 'today' ? 'active' : ''}" data-action="tab" data-tab="today">Today</button>
        <button class="pr-tab ${state.tab === 'alltime' ? 'active' : ''}" data-action="tab" data-tab="alltime">🏆 Who poops the most</button>
      </div>

      ${boardHtml}

      <div class="pr-section-title" style="margin-top:20px;">Your recent activity</div>
      ${myFeed.length === 0 ? `<div class="pr-empty">Nothing logged yet.</div>` :
        myFeed.map(p => `<div class="pr-feed-item"><span>${fmtTime(p.ts)}</span><span>${timeAgo(p.ts)}</span></div>`).join('')}
    `;
  }

  function render(){
    let html = '';
    if (state.screen === 'loading') html = `<div class="pr-loading">Warming up the throne… 🚽</div>`;
    else if (state.screen === 'login') html = renderLogin();
    else html = renderDashboard();

    root.innerHTML = html + (state.toast ? `<div class="pr-toast">${escapeHtml(state.toast)}</div>` : '');

    const nameInput = document.getElementById('pr-name-input');
    if (nameInput) {
      nameInput.oninput = e => { state.loginName = e.target.value; };
      nameInput.onkeydown = e => { if (e.key === 'Enter') handleCreateOrLogin(state.loginName, state.loginEmoji, state.loginPhoto); };
    }
    const photoInput = document.getElementById('pr-photo-input');
    if (photoInput) {
      photoInput.onchange = e => { if (e.target.files && e.target.files[0]) handlePhotoFile(e.target.files[0]); };
    }
  }

  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'login') handleCreateOrLogin(state.loginName, state.loginEmoji, state.loginPhoto);
    else if (action === 'quick-login') {
      const u = state.users[btn.dataset.slug];
      if (u) handleCreateOrLogin(u.name, u.avatar, u.photo);
    }
    else if (action === 'log') handleLogPoop();
    else if (action === 'switch') handleSwitchUser();
    else if (action === 'tab') { state.tab = btn.dataset.tab; render(); }
    else if (action === 'pick-emoji') { state.loginEmoji = btn.dataset.emoji; state.loginPhoto = null; render(); }
    else if (action === 'upload-trigger') { const inp = document.getElementById('pr-photo-input'); if (inp) inp.click(); }
  });

  init();
})();
</script>
